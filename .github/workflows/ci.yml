name: test-and-smoke

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install core dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit and contract tests
        run: python -m pytest -q
      - name: Verify audited V4 core
        run: python scripts/verify_v4_preservation.py
      - name: Verify accepted v5.2 release evidence
        run: python scripts/verify_release_artifacts.py
      - name: Run isolated smoke pipeline
        env:
          MULTITAXI_PYTHON: python
        run: bash run_smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: |
            _smoke_workspace/processed_data/*.csv
            _smoke_workspace/processed_data/*.json
            _smoke_workspace/results/figures/*.png
