project_version: "5.1.0"

experiment:
  start_zone: 1
  start_time: "08:00"
  episodes: 12
  competition_scenario: medium
  global_shapley_players: 4
  global_shapley_permutations: 32

run:
  deterministic_cpu: true
  download_data: false
  include_q_learning: false
  include_dqn: false
  include_legacy: false
  fast: true
  skip_validation: true
  skip_competition_sensitivity: true
  # Mock data do not reproduce the six-month TLC fare-share calibration sample.
  fare_share_calibration_check: false

cost_models:
  primary: fare_share
  v4_legacy:
    revenue_share: 1.0
    occupied_cost_per_mile: 0.35
    empty_cost_per_mile: 0.35
  owner_operator:
    revenue_share: 1.0
    occupied_cost_per_mile: 0.70
    empty_cost_per_mile: 0.70
  fixed_lease:
    revenue_share: 1.0
    occupied_cost_per_mile: 0.25
    empty_cost_per_mile: 0.25
    fixed_lease_per_hour: 9.0
  fare_share:
    revenue_share: 0.6979
    occupied_cost_per_mile: 0.25
    empty_cost_per_mile: 0.25
    fixed_lease_per_hour: 0.0
    fare_share_rate: 0.3021
    source_farebox_share_rate: 0.35
    tips_retained_fully: true

path_shapley:
  permutations: 64
